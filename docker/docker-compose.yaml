services:
  mysql:
    image: mysql:8
    container_name: ShimentTracking
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: shipment_tracking
      MYSQL_USER: user
      MYSQL_PASSWORD: 123456
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
